<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timbre</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<meta name="apple-mobile-web-app-title" content="Timbre">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#e4572e">
<style>
  :root { --bg:#f6f4ef; --fg:#1d1d1b; --accent:#e4572e; --muted:#6b6b66; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--fg);
         min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card { width:100%; max-width:420px; text-align:center; }
  h1 { font-size:1.6rem; margin:0 0 4px; }
  p { color:var(--muted); margin:0 0 20px; line-height:1.4; }
  input, textarea { width:100%; padding:12px 14px; border:1px solid #d6d3cb; border-radius:12px; font:inherit; margin-bottom:10px; background:#fff; }
  textarea { resize:none; height:70px; }
  .bell { width:190px; height:190px; border-radius:50%; border:none; background:var(--accent); color:#fff; font-size:1.2rem;
          font-weight:700; margin:16px auto; display:flex; flex-direction:column; align-items:center; justify-content:center;
          gap:6px; cursor:pointer; box-shadow:0 10px 30px rgba(228,87,46,.35); transition:transform .1s; }
  .bell:active { transform:scale(.96); }
  .bell:disabled { background:#b9b5ab; box-shadow:none; cursor:default; }
  .bell svg { width:56px; height:56px; }
  .status { min-height:1.4em; font-weight:600; }
  .ok { color:#2a7d46; } .err { color:#b3261e; }
  .btn { display:inline-block; padding:12px 18px; border-radius:12px; background:var(--fg); color:#fff; border:none; font:inherit; cursor:pointer; text-decoration:none; margin:4px; }
  .btn.wa { background:#25d366; }
  .box { background:#fff; border-radius:16px; padding:18px; margin:14px 0; text-align:left; }
  .box h2 { font-size:1rem; margin:0 0 8px; }
  code { word-break:break-all; background:#f0eee8; padding:2px 6px; border-radius:6px; font-size:.85rem; }
  #qr { display:block; margin:10px auto; width:240px; height:240px; }
  small { color:var(--muted); }
  .btn.video { background:#2f6fde; font-size:1.05rem; padding:14px 22px; }
  .btn.red { background:#c62828; }
  video { width:100%; border-radius:16px; background:#000; margin:10px 0; max-height:60vh; object-fit:cover; }
  #yo { width:110px; position:fixed; right:16px; bottom:16px; margin:0; z-index:5; }
  .hide { display:none !important; }
</style>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
<div class="card" id="app"></div>

<script>
// ==== CONFIGURACIÓN ====
// Servidor de notificaciones (gratis). Podés usar tu propio servidor ntfy si querés.
const NTFY = "https://ntfy.sh";
const COOLDOWN_SEG = 30; // evita que toquen 20 veces seguidas

const params = new URLSearchParams(location.search);
const topic = params.get("t");
const casa  = params.get("n") || "la casa";
const telDueno = (params.get("c") || "").replace(/[^\d+]/g, ""); // tu número (opcional)
const app = document.getElementById("app");

const atenderId = params.get("atender");

if (topic && atenderId) atender();
else if (topic) visitante();
else configuracion();

// ---------- Página que ve el visitante ----------
// Un solo botón: toca el timbre y abre la videollamada. Si el visitante no da
// permiso de cámara (o falla la conexión de video), igual te llega el aviso.
function visitante() {
  app.innerHTML = `
    <h1>Bienvenido a ${esc(casa)}</h1>
    <p>Tocá el timbre: te vamos a atender por videollamada.</p>
    <input id="nombre" placeholder="Tu nombre (opcional)" maxlength="40">
    <input id="telvis" type="tel" inputmode="tel" placeholder="Tu teléfono (opcional, para que te llamen)" maxlength="20">
    <textarea id="msg" placeholder="Mensaje (opcional): delivery, visita, etc." maxlength="140"></textarea>
    <button class="bell" id="bell">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22Zm7-6V11a7 7 0 0 0-5.5-6.84V3.5a1.5 1.5 0 0 0-3 0v.66A7 7 0 0 0 5 11v5l-2 2v1h18v-1l-2-2Z"/></svg>
      <span id="bellTxt">Tocar timbre</span>
    </button>
    <div id="vzone" class="hide">
      <video id="yo" autoplay playsinline muted></video>
      <audio id="ellos" autoplay playsinline></audio>
      <button class="btn hide" id="oir">🔊 Tocá para escuchar</button>
      <button class="btn red" id="cortar">Cortar</button>
    </div>
    <div class="status" id="st"></div>
    ${telDueno ? `
    <p style="margin:18px 0 6px">¿Preferís hablar por teléfono?</p>
    <a class="btn" href="tel:${telDueno}">📞 Llamar</a>
    <a class="btn wa" href="https://wa.me/${telDueno.replace("+", "")}" target="_blank">💬 WhatsApp</a>` : ""}`;
  document.getElementById("bell").onclick = tocarTimbre;
}

async function tocarTimbre() {
  const $ = id => document.getElementById(id);
  const bell = $("bell"), st = $("st");
  const estado = (txt, cls) => { st.className = "status " + (cls || ""); st.textContent = txt; };

  const nombre = $("nombre").value.trim();
  const msg = $("msg").value.trim();
  const telVis = $("telvis").value.replace(/[^\d+]/g, "");
  let cuerpo = (nombre ? nombre + " está en la puerta" : "Alguien está en la puerta");
  if (msg) cuerpo += "\n💬 " + msg;
  if (telVis) cuerpo += "\n📞 " + telVis;

  // Envía la notificación. linkAtender = null si no hay video.
  const avisar = async (linkAtender) => {
    const acciones = [];
    if (linkAtender) acciones.push(`view, Atender video, ${linkAtender}`);
    if (telVis) acciones.push(`view, Llamar, tel:${telVis}`, `view, WhatsApp, https://wa.me/${telVis.replace("+", "")}`);
    const q = new URLSearchParams({
      title: "Timbre - " + casa,
      priority: linkAtender ? "urgent" : "high",
      tags: linkAtender ? "bell,video_camera" : "bell"
    });
    if (acciones.length) q.set("actions", acciones.slice(0, 3).join("; "));
    if (linkAtender) q.set("click", linkAtender);
    const r = await fetch(`${NTFY}/${encodeURIComponent(topic)}?${q}`, {
      method: "POST",
      body: cuerpo + (linkAtender ? "\n📹 Esperando en videollamada" : "")
    });
    if (!r.ok) throw new Error(r.status);
  };

  // Aviso sin video (si no hay cámara o falla la videollamada)
  const soloTimbre = async (motivo) => {
    estado("Avisando…");
    try {
      await avisar(null);
      estado("¡Listo! Ya avisamos" + (motivo ? " (sin video)" : "") + ". Esperá un momento 🙂", "ok");
      cuentaRegresiva(bell);
    } catch {
      estado("No se pudo avisar. Revisá tu conexión e intentá de nuevo.", "err");
      bell.disabled = false;
    }
  };

  bell.disabled = true;
  estado("Activando cámara y micrófono…");

  let stream, peer, timeout, avisado = false, cerrado = false;
  const terminar = (texto, cls) => {
    if (cerrado) return; cerrado = true;
    clearTimeout(timeout);
    try { peer && peer.destroy(); } catch {}
    try { stream && stream.getTracks().forEach(t => t.stop()); } catch {}
    $("yo").srcObject = null;
    $("vzone").classList.add("hide"); $("oir").classList.add("hide");
    estado(texto || "Llamada terminada.", cls);
    cuentaRegresiva(bell);
  };

  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: true });
  } catch {
    return soloTimbre("sin cámara");
  }
  if (typeof Peer === "undefined") {
    stream.getTracks().forEach(t => t.stop());
    return soloTimbre("sin video");
  }

  $("vzone").classList.remove("hide");
  $("yo").srcObject = stream;
  $("cortar").onclick = () => terminar("Cortaste la llamada.");
  estado("Conectando…");

  peer = new Peer("timbre-" + crypto.getRandomValues(new Uint32Array(3)).join(""));

  peer.on("open", async (id) => {
    const link = `${location.href.split("?")[0]}?t=${encodeURIComponent(topic)}&n=${encodeURIComponent(casa)}&atender=${encodeURIComponent(id)}`;
    try { await avisar(link); avisado = true; }
    catch { return terminar("No se pudo avisar. Revisá tu conexión e intentá de nuevo.", "err"); }
    estado("🔔 ¡Timbre tocado! Esperá que te atiendan…", "ok");
    timeout = setTimeout(() => terminar("No atendieron la videollamada, pero el aviso ya llegó. Esperá un momento 🙂"), 120000);
  });

  // Cuando atendés, tu celular se conecta y el visitante te llama con su
  // video + audio (así el video siempre viaja hacia vos).
  peer.on("connection", (conn) => {
    clearTimeout(timeout);
    estado("Conectando video…");
    const iniciar = () => {
      const call = peer.call(conn.peer, stream);
      call.on("stream", (remoto) => {
        estado("¡Conectado! Ya te están viendo y escuchando.", "ok");
        const a = $("ellos"); a.srcObject = remoto;
        a.play().catch(() => { $("oir").classList.remove("hide"); $("oir").onclick = () => { a.play(); $("oir").classList.add("hide"); }; });
      });
      call.on("close", () => terminar("La llamada terminó. ¡Gracias!"));
    };
    if (conn.open) iniciar(); else conn.on("open", iniciar);
    conn.on("close", () => terminar("La llamada terminó. ¡Gracias!"));
  });

  peer.on("error", () => {
    if (avisado) return terminar("Se cortó la videollamada, pero el aviso ya llegó.");
    // Falló el video antes de avisar: tocamos el timbre igual, sin video
    cerrado = true; clearTimeout(timeout);
    try { peer.destroy(); } catch {}
    stream.getTracks().forEach(t => t.stop());
    $("vzone").classList.add("hide");
    soloTimbre("sin video");
  });
}

// ---------- Videollamada: lado tuyo (al tocar "Atender") ----------
function atender() {
  app.innerHTML = `
    <h1>Puerta de ${esc(casa)}</h1>
    <p id="ast">Alguien quiere hablar con vos.</p>
    <video id="ellos" autoplay playsinline class="hide"></video>
    <button class="btn video" id="abtn">📞 Atender</button>
    <div id="ctrl" class="hide">
      <button class="btn" id="mute">🎙️ Silenciar</button>
      <button class="btn red" id="colgar">Colgar</button>
    </div>`;
  const $ = id => document.getElementById(id);
  let peer, stream, call;
  const fin = (t) => {
    try { call && call.close(); } catch {}
    try { peer && peer.destroy(); } catch {}
    try { stream && stream.getTracks().forEach(x => x.stop()); } catch {}
    $("ast").textContent = t || "Llamada terminada.";
    $("ctrl").classList.add("hide"); $("ellos").classList.add("hide");
  };

  $("abtn").onclick = async () => {
    $("abtn").classList.add("hide");
    $("ast").textContent = "Conectando…";
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch { return fin("Necesitás dar permiso de micrófono para hablar."); }
    if (typeof Peer === "undefined") return fin("No se pudo cargar la videollamada.");
    peer = new Peer();
    peer.on("open", () => {
      // Avisamos al visitante que atendiste; él nos llama con su video.
      const conn = peer.connect(atenderId);
      conn.on("close", () => fin("El visitante cortó."));
    });
    peer.on("call", (c) => {
      call = c;
      call.answer(stream);
      call.on("stream", (remoto) => {
        const v = $("ellos"); v.srcObject = remoto; v.classList.remove("hide");
        v.play().catch(() => {});
        $("ast").textContent = remoto.getVideoTracks().length
          ? "Conectado. El visitante te escucha, pero no te ve."
          : "Conectado solo con audio (el visitante no tiene video).";
        $("ctrl").classList.remove("hide");
      });
      call.on("close", () => fin("El visitante cortó."));
    });
    peer.on("error", (e) => fin(e && e.type === "peer-unavailable"
      ? "El visitante ya cortó o se fue." : "No se pudo conectar. Probá de nuevo."));
  };
  $("colgar").onclick = () => fin("Colgaste la llamada.");
  $("mute").onclick = () => {
    const t = stream.getAudioTracks()[0]; t.enabled = !t.enabled;
    $("mute").textContent = t.enabled ? "🎙️ Silenciar" : "🔇 Activar micrófono";
  };
}

function cuentaRegresiva(bell) {
  let s = COOLDOWN_SEG;
  const txt = document.getElementById("bellTxt") || bell.lastChild;
  const t = setInterval(() => {
    txt.textContent = `Esperá ${s--}s`;
    if (s < 0) { clearInterval(t); txt.textContent = "Tocar timbre"; bell.disabled = false; }
  }, 1000);
}

// ---------- Página de configuración (para vos) ----------
function configuracion() {
  const guardado = (() => { try { return localStorage.getItem("timbre_topic"); } catch { return null; } })();
  const nuevo = guardado || "timbre-" + crypto.getRandomValues(new Uint32Array(2)).join("").slice(0, 14);
  try { localStorage.setItem("timbre_topic", nuevo); } catch {}

  app.innerHTML = `
    <h1>Configurá tu timbre QR</h1>
    <p>Hacelo una sola vez. Después imprimí el QR y pegalo en la puerta.</p>

    <div class="box">
      <h2>1. Instalá la app ntfy en tu celular</h2>
      <small>Gratis, Android (Play Store / F-Droid) e iPhone (App Store).</small>
    </div>

    <div class="box">
      <h2>2. Suscribite a tu canal secreto</h2>
      <small>En la app tocá “+” y pegá este nombre:</small><br>
      <code id="topic">${nuevo}</code>
      <div style="text-align:center;margin-top:10px">
        <button class="btn" onclick="navigator.clipboard.writeText('${nuevo}')">Copiar</button>
      </div>
      <small>Que sea difícil de adivinar: cualquiera que lo sepa puede leer o mandar avisos.</small>
    </div>

    <div class="box">
      <h2>3. Nombre que verá el visitante</h2>
      <input id="nombre" placeholder="Ej: Familia Gómez" maxlength="40">
      <h2>Tu teléfono (opcional)</h2>
      <input id="tel" type="tel" inputmode="tel" placeholder="Ej: +5491112345678" maxlength="20">
      <small>Si lo ponés, el visitante verá botones para llamarte o escribirte por WhatsApp. Ojo: tu número queda visible para quien escanee el QR. Usá el formato internacional: +54 9 y el número con característica.</small>
    </div>

    <div class="box" style="text-align:center">
      <h2>4. Tu QR</h2>
      <img id="qr" alt="Código QR del timbre">
      <code id="url"></code><br>
      <a class="btn" id="probar" target="_blank">Probar timbre</a>
      <a class="btn" id="bajar" download="timbre-qr.png">Descargar QR</a>
    </div>`;

  const inp = document.getElementById("nombre");
  const actualizar = () => {
    const base = location.href.split("?")[0];
    const n = inp.value.trim();
    const c = document.getElementById("tel").value.replace(/[^\d+]/g, "");
    const url = `${base}?t=${encodeURIComponent(nuevo)}${n ? "&n=" + encodeURIComponent(n) : ""}${c ? "&c=" + encodeURIComponent(c) : ""}`;
    const qr = `https://api.qrserver.com/v1/create-qr-code/?size=600x600&margin=20&data=${encodeURIComponent(url)}`;
    document.getElementById("url").textContent = url;
    document.getElementById("qr").src = qr;
    document.getElementById("bajar").href = qr;
    document.getElementById("probar").href = url;
  };
  inp.oninput = actualizar; document.getElementById("tel").oninput = actualizar; actualizar();
}

function esc(s) { return s.replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
</script>
</body>
</html>
